services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: loan-api:1.0.0
    ports:
      # Override with API_PORT
      - "${API_PORT:-8000}:8000"
    environment:
      MODEL_PATH: /app/model/loan_model.joblib
      DATABASE_URL: postgresql://loan:loan_dev_password@db:5432/loans
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: loan
      # Dev only
      POSTGRES_PASSWORD: loan_dev_password
      POSTGRES_DB: loans
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
