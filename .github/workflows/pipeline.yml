# .github/workflows/pipeline.yml: test -> build and push
name: Test, build and deploy
on:
  push:
    branches: [capstone]  # release branch for the capstone
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python train.py
      - run: pytest -v
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'  # pull requests are tested, never deployed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the image, stamped with this commit, and push both tags
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loan-api
          docker build -f Dockerfile.prod --build-arg GIT_SHA=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE
          echo "Pushed $IMAGE:${{ github.sha }} and $IMAGE:latest"
